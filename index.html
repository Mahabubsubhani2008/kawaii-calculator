
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎀 Kawaii Calculator 🎀</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="page">
        <header>
            <h1>💗 Kawaii Calculator 💜</h1>
            <p>Small calculations... Big smiles! 🌸</p>
        </header>

        <main class="calculator">
            <div class="display-box">
                <input
                    type="text"
                    id="display"
                    value="0"
                    readonly
                    aria-label="Calculator display"
                >
            </div>

            <p id="message" aria-live="polite">
                Ready to calculate? 🧮💗
            </p>

            <div class="buttons">
                <button class="number" onclick="press('7')">7</button>
                <button class="number" onclick="press('8')">8</button>
                <button class="number" onclick="press('9')">9</button>
                <button class="operator" onclick="press('/')">÷</button>

                <button class="number" onclick="press('4')">4</button>
                <button class="number" onclick="press('5')">5</button>
                <button class="number" onclick="press('6')">6</button>
                <button class="operator" onclick="press('*')">×</button>

                <button class="number" onclick="press('1')">1</button>
                <button class="number" onclick="press('2')">2</button>
                <button class="number" onclick="press('3')">3</button>
                <button class="operator" onclick="press('-')">−</button>

                <button class="number" onclick="press('0')">0</button>
                <button class="number" onclick="press('.')">.</button>
                <button class="operator" onclick="press('+')">+</button>
                <button class="equals" onclick="calculate()">=</button>

                <button class="clear" onclick="clearDisplay()">AC 🧹</button>
                <button class="backspace" onclick="backspace()">⌫ Undo</button>
            </div>

            <footer>Made with 💗 and JavaScript</footer>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
